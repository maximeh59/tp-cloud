services:
    web:
        build: .
        ports: ["8000:8080"]
        environment:
            DATABASE_URL: "postgresql://app:secret@db:5432/app"
        depends_on:
            db:
                condition: service_healthy
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: secret
        volumes: ["pgdata:/var/lib/postgresql/data"]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s
volumes:
    pgdata: